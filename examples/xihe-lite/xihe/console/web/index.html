<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>曦和 · 精简可运行版 控制台</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e242c; --line:#2a323c;
    --fg:#e6ebf2; --dim:#8b98a8; --ok:#3ddc84; --warn:#ffc046; --err:#ff5f56;
    --accent:#4aa8ff; --sim:#b06cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.55 "Microsoft YaHei","Segoe UI",system-ui,sans-serif}
  a{color:var(--accent)}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
         padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);
         position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0 12px 0 0;font-weight:600;letter-spacing:.5px}
  .badge{padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);
         background:var(--panel2);color:var(--dim)}
  .badge.ok{color:var(--ok);border-color:#245c3c}
  .badge.sim{color:var(--sim);border-color:#4a2f6b}
  .badge.warn{color:var(--warn);border-color:#5a4620}
  .badge.err{color:var(--err);border-color:#5c2a26}
  .spacer{flex:1}
  main{padding:16px 18px 40px;max-width:1280px;margin:0 auto}
  section{margin-bottom:18px}
  h2{font-size:13px;color:var(--dim);font-weight:600;letter-spacing:1px;
     margin:0 0 8px;text-transform:uppercase}
  .grid{display:grid;gap:10px}
  .svcs{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .svc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .svc .name{font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px #3ddc8466}
  .svc .meta{color:var(--dim);font-size:12px;margin:6px 0 8px}
  .svc .btns{display:flex;flex-wrap:wrap;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:7px 12px;min-width:92px}
  .chip b{display:block;font-size:19px;line-height:1.2}
  .chip span{color:var(--dim);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:12px}
  tr:hover td{background:#1b222a}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;
         white-space:nowrap}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:#12406b;border-color:#1c5c99;color:#d6ecff}
  button.danger:hover{border-color:var(--err);color:var(--err)}
  button.big{padding:8px 16px;font-size:14px}
  input[type=text],input[type=file],select,textarea{
         background:#0c0f13;color:var(--fg);
         border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px}
  textarea{width:100%;min-height:56px;resize:vertical;font-family:inherit}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  pre{background:#0c0f13;border:1px solid var(--line);border-radius:8px;padding:10px;
      max-height:260px;overflow:auto;font-size:12px;line-height:1.5;margin:8px 0 0;
      white-space:pre-wrap;word-break:break-all}
  .concl{font-size:14px;padding:10px 12px;border-radius:8px;background:#0c0f13;
         border:1px solid var(--line)}
  .concl.ok{color:var(--ok)} .concl.warn{color:var(--warn)} .concl.err{color:var(--err)}
  .muted{color:var(--dim)}
  .last{border-left:3px solid var(--line);padding-left:10px}
  .last.ok{border-color:var(--ok)} .last.sim{border-color:var(--sim)}
  .last.err{border-color:var(--err)} .last.warn{border-color:var(--warn)}
  .reply{font-size:14px;padding:10px 12px;border-radius:8px;background:#0c0f13;
         border:1px solid var(--line);margin-top:8px;min-height:20px}
  .toast{position:fixed;right:16px;bottom:16px;background:#12406b;color:#d6ecff;
         border:1px solid #1c5c99;padding:10px 14px;border-radius:8px;max-width:460px;
         opacity:0;transition:.25s;font-size:13px;z-index:20;white-space:pre-wrap}
  .toast.show{opacity:1}
  code{background:#0c0f13;padding:1px 5px;border-radius:4px;font-size:12px}
  .tierlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tier{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
        background:#0c0f13;color:var(--dim)}
  .tier.on{color:var(--sim);border-color:#4a2f6b}
</style>
</head>
<body>
<header>
  <h1>曦和 · 精简可运行版</h1>
  <span class="badge" id="b-app">连接中…</span>
  <span class="badge" id="b-health">健康 ?/?</span>
  <span class="badge" id="b-backend">打印后端：?</span>
  <span class="badge" id="b-daemon">守护：?</span>
  <span class="badge" id="b-port">端口</span>
  <span class="spacer"></span>
  <button class="primary big" id="btnToggle" onclick="toggleAll()">一键启停</button>
  <button onclick="runPreflight(true)">前置自检</button>
</header>

<main>
  <section>
    <h2>服务健康</h2>
    <div class="grid svcs" id="svcs"></div>
  </section>

  <section>
    <h2>测试指令 · 智能路由骨架</h2>
    <div class="card">
      <textarea id="cmdText" placeholder="输入一条文本测试指令，例如：帮我打印一张测试页">帮我打印一张测试页</textarea>
      <div class="row">
        <button class="primary" onclick="sendRoute()">走智能路由（四级降级）</button>
        <button onclick="sendPrintTest()">下发打印测试页</button>
        <span class="muted" id="routeHint">路由会依次尝试：云端 API → 本地大模型（兜底）→ 异地算力 → 离线规则</span>
      </div>
      <div class="tierlist" id="tiers"></div>
      <div class="reply" id="reply"><span class="muted">还没有下发过指令。</span></div>
      <pre id="routeLog" class="muted">（[ROUTE] 流转会显示在这里，同时写入 runtime/logs/router.log）</pre>
    </div>
  </section>

  <section>
    <h2>打印链路 · 暂存与队列</h2>
    <div class="card">
      <div class="chips" id="chips"></div>
      <div class="row" id="queueRow"></div>
      <div class="row">
        <button class="primary" onclick="act('/api/print/clear',{},'已发取消信号')">清空队列（clear）</button>
        <input type="text" id="retryName" placeholder="要重投的文件名（在 _失败 / _队列 / _模拟 里）" style="min-width:320px">
        <button onclick="retry()">重投</button>
      </div>
      <div class="last" id="last" style="margin-top:12px"></div>
    </div>
  </section>

  <section>
    <h2>打印调度 · 仓库</h2>
    <div class="card">
      <table>
        <thead><tr><th style="width:34px"></th><th>文件</th><th>类型</th><th>大小</th>
        <th>修改时间</th><th style="width:150px">操作</th></tr></thead>
        <tbody id="repo"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
      </table>
      <div class="row">
        <button class="primary" onclick="printSelected()">提交选中打印</button>
        <button class="danger" onclick="deleteSelected()">删除选中</button>
        <button onclick="act('/api/demo',{},'已生成演示样本')">生成演示样本</button>
        <span class="spacer"></span>
        <input type="file" id="up" multiple>
        <button onclick="upload()">上传到仓库</button>
      </div>
      <div class="row">
        <input type="text" id="pathInput" placeholder="或者直接填一个本机文件路径（相对本目录即可）" style="flex:1;min-width:320px">
        <button onclick="submitPath()">按路径提交</button>
      </div>
    </div>
  </section>

  <section>
    <h2>演示前置自检</h2>
    <div class="concl" id="preflight">点右上角「前置自检」跑一次（只读，不打印）</div>
  </section>

  <section>
    <h2>日志</h2>
    <div class="card">
      <div class="row">
        <select id="logSel" onchange="loadLog()"></select>
        <input type="text" id="logN" value="120" style="width:80px">
        <button onclick="loadLog()">刷新</button>
      </div>
      <pre id="logBox" class="muted">（选一个服务看日志）</pre>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let REPO = [];

function api(path){
  return fetch(path, {cache:'no-store'}).then(r=>r.json());
}
function post(path, body){
  return fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                      body:JSON.stringify(body||{})}).then(r=>r.json());
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 3600);
}
function act(path, body, okMsg){
  post(path, body).then(r=>{
    toast((r.ok===false ? '失败：' + (r.msg||JSON.stringify(r)) : (okMsg || '完成')));
    setTimeout(refresh, 400);
  }).catch(e=>toast('请求失败：'+e));
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function size(n){
  n = Number(n||0);
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(2) + ' MB';
}
function tstr(ms){
  if(!ms) return '—';
  const d = new Date(Number(ms));
  const p = x=>String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/* ---------------------------------------------------------------- 服务 */
function renderServices(list){
  const box = $('#svcs');
  if(!list || !list.length){ box.innerHTML = '<div class="card muted">没有注册服务</div>'; return; }
  box.innerHTML = list.map(s=>{
    const on = !!s.running;
    return `<div class="card svc">
      <div class="top"><span class="name">${esc(s.name||s.id)}</span>
        <span class="dot ${on?'on':''}"></span></div>
      <div class="meta">${esc(s.id)} · ${s.port?(':'+s.port):'无端口'} ·
        ${on?('运行中'+(s.pid?(' pid='+s.pid):'')):'未运行'}
        ${s.probe===true?' · probe ok':(s.probe===false?' · probe 失败':'')}</div>
      <div class="btns">
        <button onclick="svc('start','${esc(s.id)}')">启动</button>
        <button onclick="svc('stop','${esc(s.id)}')">停止</button>
        <button onclick="svc('restart','${esc(s.id)}')">重启</button>
        <button onclick="showLog('${esc(s.id)}')">日志</button>
      </div></div>`;
  }).join('');
  const sel = $('#logSel');
  const cur = sel.value;
  sel.innerHTML = list.map(s=>`<option value="${esc(s.id)}">${esc(s.name||s.id)}</option>`).join('');
  if(cur) sel.value = cur;
}
function svc(action, id){ act('/api/svc/'+action, {id:id}, action==='stop'?'已停止':'已发起'); }
function toggleAll(){
  post('/api/toggle', {}).then(r=>{
    toast(r.action === 'stop' ? '已一键停止全部服务' : '已一键启动全部服务');
    setTimeout(refresh, 800);
  }).catch(e=>toast('请求失败：'+e));
}

/* ---------------------------------------------------------------- 打印 */
function renderPrint(p){
  const st = p.staging || {};
  const keys = [['ready','待打印'],['printing','处理中'],['hold','未确认'],
                ['done','已打印'],['sim','模拟归档'],['failed','失败']];
  $('#chips').innerHTML = keys.map(([k,label])=>
    `<div class="chip"><b>${st[k]===undefined?0:st[k]}</b><span>${label}</span></div>`).join('');

  const q = p.queue || {}, e = p.ews || {}, d = p.daemon || {};
  $('#queueRow').innerHTML =
    `<span class="badge">打印队列：${q.ok?(q.jobs+' 个任务'):('读不到'+(q.msg?('（'+q.msg+'）'):''))}</span>` +
    `<span class="badge ${e.cat==='ready'?'ok':''}">EWS：${esc(e.cat||'unknown')}</span>` +
    `<span class="badge">打印机：${esc(p.printer||'系统默认')}</span>` +
    `<span class="badge ${d.running?'ok':'warn'}">守护：${d.running?('在跑 :'+(d.port||'')):'未启动'}</span>` +
    (st.ready?`<span class="badge">待打印：${esc((p.ready||[]).join('、'))}</span>`:'');

  const last = p.last || {};
  const box = $('#last');
  if(!last || !last.result){
    box.className = 'last';
    box.innerHTML = '<span class="muted">还没有处理过打印任务。</span>';
  }else{
    const cls = last.result==='printed'?'ok':(last.result==='simulated'?'sim':
                (last.ok?'ok':'err'));
    box.className = 'last ' + cls;
    box.innerHTML = `<div><b>最近一次：${esc(last.result_text||last.result)}</b>
      ${last.simulated?'<span class="badge sim">模拟模式</span>':''}
      ${last.verified?'<span class="badge ok">真机确认出纸</span>':''}</div>
      <div class="muted">${esc(last.name||'')} · 归档：${esc(last.dest_rel||last.dest||'—')}</div>
      <pre>${esc(last.receipt||'')}</pre>`;
  }
  const b = p.backend || {};
  const bb = $('#b-backend');
  bb.textContent = '打印后端：' + (b.name||'?') + (b.simulated?'（模拟模式）':'（真机）');
  bb.className = 'badge ' + (b.simulated?'sim':'ok');
  const db = $('#b-daemon');
  db.textContent = '守护：' + (d.running?'在跑':'未启动');
  db.className = 'badge ' + (d.running?'ok':'warn');
}

/* ---------------------------------------------------------------- 路由 */
function renderRoute(r){
  if(!r) return;
  const box = $('#tiers');
  if(box.dataset.done !== String(r.tiers.length)){
    box.dataset.done = String(r.tiers.length);
    box.innerHTML = r.tiers.map(t=>
      `<span class="tier ${t.available?'on':''}" title="${esc(t.desc)}">${esc(t.role)} ${esc(t.name)}</span>`).join('');
  }
  if(r.last){
    $('#reply').innerHTML = `<b>${esc(r.last.tier_name||'未命中')}</b>
      <span class="muted">（${esc(r.last.tier||'')}，${r.last.elapsed_ms} ms）</span>
      <div style="margin-top:6px">${esc(r.last.reply||'')}</div>`;
    $('#routeLog').classList.remove('muted');
    $('#routeLog').textContent = (r.last.route_log||[]).join('\n');
    $('#routeLog').scrollTop = $('#routeLog').scrollHeight;
  }
}
function sendRoute(){
  const text = $('#cmdText').value.trim() || 'ping';
  $('#reply').innerHTML = '<span class="muted">路由中…</span>';
  post('/api/route/test', {text}).then(r=>{
    if(r.ok){ renderRoute({tiers:[], last:r}); }
    toast(r.ok ? ('路由成功：' + (r.tier_name||'')) : '路由未命中任何一级');
    refresh();
  }).catch(e=>toast('路由请求失败：'+e));
}
function sendPrintTest(){
  const text = $('#cmdText').value.trim();
  post('/api/print/test', {text}).then(r=>{
    toast(r.ok ? ('已进入打印队列：' + r.queued) : ('失败：' + (r.msg||'')));
    refresh();
  }).catch(e=>toast('请求失败：'+e));
}

/* ---------------------------------------------------------------- 状态 */
async function refresh(){
  try{
    const s = await api('/api/status');
    $('#b-app').textContent = `v${s.app.version} · 运行 ${s.app.uptime}s`;
    $('#b-app').className = 'badge ok';
    $('#b-health').textContent = `健康 ${s.health.healthy}/${s.health.total}`;
    $('#b-health').className = 'badge ' + (s.health.ok ? 'ok' : 'warn');
    $('#b-port').textContent = '端口 ' + s.app.port;
    renderServices(s.services);
    renderPrint(s.print);
    if(s.route) renderRoute(s.route);
    const anyOn = (s.services||[]).some(x=>x.running);
    $('#btnToggle').textContent = anyOn ? '一键停止全部' : '一键启动全部';
  }catch(e){ $('#b-app').textContent = '连接失败'; $('#b-app').className='badge err'; }
}

/* ---------------------------------------------------------------- 仓库 */
async function loadRepo(){
  try{
    const r = await api('/api/repo');
    REPO = r.items || [];
    if(!REPO.length){
      $('#repo').innerHTML = '<tr><td colspan="6" class="muted">仓库为空 —— 点「生成演示样本」或上传文件</td></tr>';
      return;
    }
    $('#repo').innerHTML = REPO.map((f,i)=>`<tr>
      <td><input type="checkbox" data-i="${i}" ${f.printable?'':'disabled'}></td>
      <td>${esc(f.name)}</td><td>${esc(f.ext||'')}</td><td>${size(f.size)}</td>
      <td>${tstr(f.mtime)}</td>
      <td><button onclick="submitOne('${esc(f.name).replace(/'/g,"\\'")}')">打印</button></td>
    </tr>`).join('');
  }catch(e){ $('#repo').innerHTML = '<tr><td colspan="6" class="muted">读取失败</td></tr>'; }
}
function checkedNames(){
  return [...document.querySelectorAll('#repo input[type=checkbox]:checked')]
    .map(cb=>REPO[Number(cb.dataset.i)].name);
}
function printSelected(){
  const names = checkedNames();
  if(!names.length) return toast('先勾选要打印的文件');
  act('/api/repo/print', {names}, '已入队 ' + names.length + ' 个');
}
function deleteSelected(){
  const names = checkedNames();
  if(!names.length) return toast('先勾选要删除的文件');
  act('/api/repo/delete', {names}, '已删除');
  setTimeout(loadRepo, 500);
}
function submitOne(name){ act('/api/print/submit', {name}, '已入队：' + name); }
function submitPath(){
  const p = $('#pathInput').value.trim();
  if(!p) return toast('先填一个文件路径');
  act('/api/print/submit', {path:p}, '已入队');
}
function retry(){
  const n = $('#retryName').value.trim();
  if(!n) return toast('先填要重投的文件名');
  act('/api/print/retry', {name:n}, '已重投');
}
async function upload(){
  const fs = [...$('#up').files];
  if(!fs.length) return toast('先选文件');
  for(const f of fs){
    const b64 = await new Promise(res=>{
      const fr = new FileReader();
      fr.onload = ()=>res(String(fr.result).split(',')[1]||'');
      fr.readAsDataURL(f);
    });
    const r = await post('/api/repo/upload', {name:f.name, b64});
    toast(r.ok ? ('已上传 '+f.name) : ('上传失败：'+(r.msg||'')));
  }
  loadRepo();
}

/* ---------------------------------------------------------------- 自检 / 日志 */
async function runPreflight(force){
  const box = $('#preflight');
  box.className = 'concl muted'; box.textContent = '自检中（只读，不打印）…';
  try{
    const r = await api('/api/preflight' + (force?'?force=1':''));
    box.className = 'concl ' + (r.code===0?'ok':(r.code===2?'warn':'err'));
    box.textContent = r.conclusion + (r.cached?'（缓存）':'');
  }catch(e){ box.className='concl err'; box.textContent='自检失败：'+e; }
}
function showLog(id){ $('#logSel').value = id; loadLog(); }
async function loadLog(){
  const id = $('#logSel').value, n = $('#logN').value || 120;
  if(!id) return;
  const r = await api(`/api/log?id=${encodeURIComponent(id)}&n=${encodeURIComponent(n)}`);
  const box = $('#logBox');
  box.classList.remove('muted');
  box.textContent = (r.lines && r.lines.length) ? r.lines.join('\n') : ('（'+ (r.file||'') +' 还没有内容）');
  box.scrollTop = box.scrollHeight;
}

/* ---------------------------------------------------------------- 启动 */
refresh(); loadRepo();
setTimeout(()=>runPreflight(false), 700);
setInterval(refresh, 2000);
setInterval(loadRepo, 8000);
</script>
</body>
</html>
